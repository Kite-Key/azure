name: Publish NuGet (manual OIDC)
on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to publish (one per run)
        type: choice
        required: true
        options:
          - KiteKey.AI.Azure
          - KiteKey.AI.Azure.VoiceLive
      expected_version:
        description: Exact new package version (major.minor.patch)
        type: string
        required: true
      confirm_publishing:
        description: Confirm coordinated publication of the selected package
        type: boolean
        required: true
        default: false
permissions:
  contents: read
jobs:
  publish:
    if: github.repository == 'Kite-Key/azure' && inputs.confirm_publishing == true
    environment: nuget
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Verify release tag and project version
        shell: bash
        env:
          PACKAGE_ID: ${{ inputs.package }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          [[ "$EXPECTED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Expected version must be major.minor.patch" >&2; exit 1; }
          [[ "$GITHUB_REF" == "refs/tags/${PACKAGE_ID}-v${EXPECTED_VERSION}" ]] || { echo "Dispatch the matching package-version tag, not a branch or another tag" >&2; exit 1; }
          git fetch origin main --no-tags
          git merge-base --is-ancestor HEAD origin/main || { echo "Release tag must point to a commit on main" >&2; exit 1; }
          case "$PACKAGE_ID" in
            KiteKey.AI.Azure) project="src/dotnet/KiteKey.AI.Azure/KiteKey.AI.Azure.csproj" ;;
            KiteKey.AI.Azure.VoiceLive) project="src/dotnet/KiteKey.AI.Azure.VoiceLive/KiteKey.AI.Azure.VoiceLive.csproj" ;;
            *) echo "Unsupported package" >&2; exit 1 ;;
          esac
          actual_version="$(dotnet msbuild "$project" -getProperty:Version)"
          [[ "$actual_version" == "$EXPECTED_VERSION" ]] || { echo "Project version $actual_version differs from expected version $EXPECTED_VERSION" >&2; exit 1; }
          echo "PROJECT_PATH=$project" >> "$GITHUB_ENV"
          echo "PACKAGE_ID=$PACKAGE_ID" >> "$GITHUB_ENV"
          echo "PACKAGE_VERSION=$EXPECTED_VERSION" >> "$GITHUB_ENV"
      - name: Refuse versions already indexed on NuGet.org
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from urllib.error import HTTPError
          from urllib.request import urlopen

          package = os.environ["PACKAGE_ID"]
          version = os.environ["PACKAGE_VERSION"]
          url = f"https://api.nuget.org/v3-flatcontainer/{package.lower()}/index.json"
          try:
              with urlopen(url, timeout=30) as response:
                  versions = json.load(response)["versions"]
          except HTTPError as error:
              if error.code != 404:
                  raise
              versions = []
          if version in versions:
              raise SystemExit(f"{package} {version} is already on NuGet.org")
          print(f"{package} {version} is not indexed on NuGet.org")
          PY
      - run: dotnet test KiteKey.AI.Azure.sln --configuration Release
      - run: dotnet pack "$PROJECT_PATH" --configuration Release --no-restore --output artifacts
      - name: Verify the exact package was packed
        shell: bash
        run: test -f "artifacts/${PACKAGE_ID}.${PACKAGE_VERSION}.nupkg" && test "$(find artifacts -maxdepth 1 -name '*.nupkg' | wc -l)" -eq 1
      # NuGet/login authenticates as the trusted-publishing policy creator, not the package owner.
      - name: NuGet login as policy creator
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish selected package
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "artifacts/${PACKAGE_ID}.${PACKAGE_VERSION}.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json
